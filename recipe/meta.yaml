{% set name = "alibabacloud-adb20211201" %}
{% set version = "3.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/alibabacloud_adb20211201-{{ version }}.tar.gz
  sha256: 0179d43f93a897c926fb6a40a37266434a4739fc2747ef42576d609960577135

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - alibabacloud-tea-util <1.0.0,>=0.3.13
    - alibabacloud-tea-openapi <1.0.0,>=0.3.16
    - alibabacloud-openapi-util <1.0.0,>=0.2.2
    - alibabacloud-endpoint-util <1.0.0,>=0.0.4

test:
  imports:
    - alibabacloud_adb20211201
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/aliyun/alibabacloud-python-sdk
  summary: Alibaba Cloud adb (20211201) SDK Library for Python
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xylar
