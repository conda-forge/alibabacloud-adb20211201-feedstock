schema_version: 1

context:
  name: alibabacloud-adb20211201
  version: "4.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/alibabacloud_adb20211201-${{ version }}.tar.gz
  sha256: d0c0ff6e4c79864e34c3f55d21841d668d3c7d348cc8313c2ebaa4c04a8b1ba5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - darabonba-core >=1.0.0,<2.0.0
    - alibabacloud-tea-openapi >=0.4.5,<1.0.0

tests:
  - python:
      imports:
        - alibabacloud_adb20211201
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Alibaba Cloud adb (20211201) SDK Library for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/aliyun/alibabacloud-python-sdk

extra:
  recipe-maintainers:
    - xylar
