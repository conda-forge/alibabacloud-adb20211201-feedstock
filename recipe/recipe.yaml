schema_version: 1

context:
  name: alibabacloud-adb20211201
  version: "4.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/alibabacloud_adb20211201-${{ version }}.tar.gz
  sha256: 09548f8cd7784f26a565f8f87a52169d2b9eebc3e1b043dab5c1ce4c945a93ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - darabonba-core >=1.0.0,<2.0.0
    - alibabacloud-tea-openapi >=0.4.5,<1.0.0

tests:
  - python:
      imports:
        - alibabacloud_adb20211201
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Alibaba Cloud adb (20211201) SDK Library for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/aliyun/alibabacloud-python-sdk

extra:
  recipe-maintainers:
    - xylar
