schema_version: 1

context:
  name: alibabacloud-adb20211201
  version: "4.5.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/alibabacloud_adb20211201-${{ version }}.tar.gz
  sha256: 0cc2ced60e19596ba760c9fd0f6b5d6b03f88126f9799a7f6d35e1baa7fd112b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - alibabacloud-tea-openapi >=0.4.5,<1.0.0
    - darabonba-core >=1.0.0,<2.0.0

tests:
  - python:
      imports:
        - alibabacloud_adb20211201
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Alibaba Cloud adb (20211201) SDK Library for Python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/aliyun/alibabacloud-python-sdk

extra:
  recipe-maintainers:
    - xylar
